services:                # 要运行的服务列表
  mysql:                 # 服务名，容器间用这个名字互访
    image: mysql:8.0     # 固定版本，避免环境漂移
    container_name: tickhub-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 123456   # root 密码
      MYSQL_DATABASE: tickhub           # 首次启动自动建库
      TZ: Asia/Shanghai                 # 时区，不设会差 8 小时
    ports:
      - "3307:3306"                     # 宿主机3307 → 容器3306
    volumes:
      - mysql_data:/var/lib/mysql       # 数据持久化
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
  mysql_data:           # 声明命名卷
